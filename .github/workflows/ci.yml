name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  woocommerce:
    name: WooCommerce (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    defaults:
      run:
        working-directory: woocommerce
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3
        with:
          working-directory: woocommerce

      - name: Lint (php -l)
        run: composer run lint

      - name: PHPUnit
        run: composer run test

      - name: PHPCS
        if: matrix.php == '8.3'
        run: vendor/bin/phpcs

      - name: PHPStan
        if: matrix.php == '8.3'
        run: vendor/bin/phpstan analyse --memory-limit=1G

  prestashop:
    name: PrestaShop (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 7.1 is the module's stated floor (composer.json, CLAUDE.md), but
        # phpunit/phpunit ^8.5||^9.6 has no release that installs on 7.1
        # (8.5.x needs php >=7.2). 7.2 is therefore the LOWEST INSTALLABLE
        # floor for this test matrix; PHPCompatibility's testVersion=7.1-
        # still statically checks 7.1 syntax. See PROGRESS.md §13.
        php: ['7.2', '8.3']
    defaults:
      run:
        working-directory: prestashop
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3
        with:
          working-directory: prestashop

      - name: Lint (php -l)
        run: composer run lint

      - name: PHPUnit
        run: composer run test

      - name: PHPCS
        if: matrix.php == '8.3'
        run: vendor/bin/phpcs

      - name: PHPStan
        if: matrix.php == '8.3'
        run: vendor/bin/phpstan analyse --memory-limit=1G
